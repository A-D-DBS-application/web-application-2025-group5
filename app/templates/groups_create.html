{% extends "base.html" %}
{% block title %}Nieuwe groep{% endblock %}
{% block body_class %}bg-app{% endblock %}

{% block content %}

<div class="header-green">
    <div class="header-inner">

        <!-- Back-knop -->
        <a href="{{ url_for('groups_list') }}" class="header-back-btn">
            <svg viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </a>

        <div class="header-title-wrapper">
            <h1 class="header-title">Nieuwe groep</h1>
            <p class="header-subtitle">Maak een nieuwe groep aan om uitgaven te delen</p>
        </div>

    </div>
</div>

<main class="page top-overlap">
    <div class="card form-card">

        <form method="post" class="form">

            <!-- ICON PICKER -->
            <label class="label">Kies een icoon</label>

            <div class="icon-picker">
                {% for emoji in ["🏖️","🍽️","🎉","🚗","🏕️","🛒","💼","🏡","✈️"] %}
                <label class="icon-option">
                    <input type="radio" name="icon" value="{{ emoji }}" required>
                    <span class="icon-emoji">{{ emoji }}</span>
                </label>
                {% endfor %}
            </div>

            <!-- LIVE PREVIEW VAN HUIDIG ICOON -->
            <div class="icon-square" id="iconPreview">-</div>

            <!-- GROEPSNAAM -->
            <label class="label" for="name">Groepsnaam</label>
            <input
                type="text"
                id="name"
                name="name"
                class="input"
                placeholder="Bijv. Vakantie Spanje 2024"
                required
            >

            <!-- START- EN EINDDATUM -->
            <label class="label" for="start_date">Startdatum</label>
            <input type="date" id="start_date" name="start_date" class="input" required>

            <label class="label" for="end_date">Einddatum</label>
            <input type="date" id="end_date" name="end_date" class="input" required>

            <button type="submit" class="btn btn-primary btn-full mt-16">
                Groep aanmaken
            </button>

        </form>

    </div>
</main>

<!-- JAVASCRIPT: LIVE EMOJI PREVIEW -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    const inputs = document.querySelectorAll('input[name="icon"]');
    const preview = document.getElementById('iconPreview');

    if (!inputs.length || !preview) return;

    inputs.forEach(input => {
        input.addEventListener("change", () => {
            preview.textContent = input.value;
        });
    });

});
</script>

{% endblock %}
