<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login • FairSplit+</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
</head>
<body>
  <!-- Login-container voor gecentreerde layout -->
  <div class="login-container">
    <h2>Login</h2>

    <!-- Flash-berichten -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flash-messages">
          {% for msg in messages %}
            <li>{{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <!-- Inlogformulier -->
    <form method="post">
      <label for="username">Gebruikersnaam:</label>
      <input id="username" type="text" name="username" placeholder="Voer je naam in..." required>
      <button type="submit">Inloggen</button>
    </form>
  </div>
</body>
</html>
