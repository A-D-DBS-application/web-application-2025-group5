{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block body_class %}bg-app{% endblock %}

{% block bottom_nav %}{% endblock %}  {# geen navbar op login #}
{% block expense_modal %}{% endblock %} {# geen popup op login #}

{% block content %}
<div class="full-center">
    <div class="card login-card">
        <h1 class="card-title">Login</h1>

        <form method="post" class="form">
            <label class="label" for="username">Gebruikersnaam:</label>
            <input
                type="text"
                name="username"
                id="username"
                class="input"
                placeholder="Voer je naam in..."
                autocomplete="off"
            >
            <button type="submit" class="btn btn-primary btn-full">Inloggen</button>
        </form>
    </div>
</div>
{% endblock %}
