<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>Uitgave toevoegen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind voor de layout & kleuren -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Jouw eigen css (optioneel, laat staan als je style.css gebruikt) -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="min-h-screen bg-gradient-to-br from-[#FF8B6A] to-[#FF6B47]">
    <!-- Bovenstuk (titel / header) -->
    <div class="px-6 pt-12 pb-6">
      <button class="mb-6 text-white hover:text-white/80 transition-colors">
        <!-- Pijltje terug (gewoon tekst) -->
        ←
      </button>

      <h1 class="text-white text-3xl mb-2">Uitgave toevoegen</h1>
      <p class="text-white/80">Voeg een nieuwe uitgave toe aan Mijn Groep</p>
    </div>

    <!-- Witte kaart onderaan -->
    <div
      class="bg-white rounded-t-[2.5rem] min-h-[calc(100vh-10rem)] px-6 py-8"
    >
      <div class="max-w-md mx-auto">
        <!-- Icoon blok -->
        <div class="flex justify-center mb-8">
          <div
            class="w-20 h-20 bg-gradient-to-br from-[#FF8B6A] to-[#FF6B47] rounded-3xl flex items-center justify-center shadow-lg"
          >
            <span class="text-white text-3xl">🧾</span>
          </div>
        </div>

        <!-- FORMULIER -->
        <form class="space-y-6">
          <!-- Beschrijving -->
          <div>
            <label class="block text-gray-700 mb-2">Beschrijving</label>
            <input
              type="text"
              placeholder="Bijv. Boodschappen, Restaurant, etc."
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#FF8B6A] focus:border-transparent"
            />
          </div>

          <!-- Totaal bedrag -->
          <div>
            <label class="block text-gray-700 mb-2">Totaal bedrag</label>
            <div class="relative">
              <span
                class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"
                >€</span
              >
              <input
                type="number"
                step="0.01"
                placeholder="0.00"
                class="w-full pl-8 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#FF8B6A] focus:border-transparent"
              />
            </div>
          </div>

          <!-- Betaald door -->
          <div>
            <label class="block text-gray-700 mb-2">Betaald door</label>
            <select
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#FF8B6A] focus:border-transparent bg-white"
            >
              <option>Alice</option>
              <option>Bob</option>
              <option>Charlie</option>
            </select>
          </div>

          <!-- Verdeling -->
          <div>
            <label class="block text-gray-700 mb-3">Verdeling</label>
            <div class="flex gap-2">
              <button
                type="button"
                class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200"
              >
                Gelijk verdelen
              </button>
              <button
                type="button"
                class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200"
              >
                Aangepast
              </button>
            </div>
          </div>

          <!-- Aandelen -->
          <div>
            <label class="block text-gray-700 mb-3"
              >Verdeel het bedrag over de leden</label
            >

            <div class="space-y-3">
              <!-- 1 lid (kopieer dit blok voor meer leden) -->
              <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 flex-1">
                  <div
                    class="w-10 h-10 bg-gradient-to-br from-[#FF8B6A] to-[#FF6B47] rounded-xl flex items-center justify-center"
                  >
                    <span class="text-white">A</span>
                  </div>
                  <span class="text-gray-700">Alice</span>
                </div>

                <div class="relative w-32">
                  <span
                    class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"
                    >€</span
                  >
                  <input
                    type="number"
                    step="0.01"
                    placeholder="0.00"
                    class="w-full pl-7 pr-3 py-2 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#FF8B6A] focus:border-transparent text-sm"
                  />
                </div>
              </div>
            </div>

            <!-- Totaal check (nu nog statisch, puur layout) -->
            <div class="mt-4 p-4 bg-gray-50 rounded-xl">
              <div
                class="flex justify-between items-center text-sm"
              >
                <span class="text-gray-600">Totaal bedrag:</span>
                <span class="text-gray-900">€0.00</span>
              </div>
              <div
                class="flex justify-between items-center text-sm mt-1"
              >
                <span class="text-gray-600">Som van aandelen:</span>
                <span class="text-red-600">€0.00</span>
              </div>
            </div>
          </div>

          <!-- Knop -->
          <button
            type="submit"
            class="w-full bg-gradient-to-r from-[#FF8B6A] to-[#FF6B47] text-white py-4 rounded-xl hover:shadow-lg transition-all"
          >
            Uitgave toevoegen
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
