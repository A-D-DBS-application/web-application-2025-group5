<!DOCTYPE html>
<html>
<head><title>Mijn groepen</title></head>
<body>
  <h2>Welkom, {{ session.username }}</h2>
  <p><a href="{{ url_for('groups_create') }}">Nieuwe groep aanmaken</a> | <a href="{{ url_for('logout') }}">Uitloggen</a></p>

  <h3>Jouw groepen</h3>
  <ul>
    {% for g in groups %}
      <li>
        <a href="{{ url_for('group_detail', group_id=g.group_id) }}">{{ g.name }}</a>
        ({{ g.start_date }} – {{ g.end_date }})
      </li>
    {% else %}
      <li>Je zit nog in geen enkele groep.</li>
    {% endfor %}
  </ul>
</body>
</html>
